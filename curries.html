<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curries | Sandra's World Cuisine (SJG)</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23C85A32'/><text x='32' y='41' font-family='Playfair Display, serif' font-size='22' font-weight='bold' fill='%23FFF8F0' text-anchor='middle' letter-spacing='1'>SJG</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --bg: #FDFBF7; --card-bg: #FFFFFF; --text: #1C1917; --text-muted: #78716C; --accent: #C85A32; --border: #E7E5E4; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.6; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    nav { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--text); font-weight: 700; }
    .brand-badge { background: var(--accent); color: white; padding: 0.2rem 0.5rem; border-radius: 4px; font-family: 'Playfair Display', serif; }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 500; }
    .nav-links a:hover { color: var(--accent); }
    .container { max-width: 1200px; margin: 3rem auto; padding: 0 1.5rem; }
    h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 0.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-body { padding: 1.25rem; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 0.5rem; }
    .btn-recipe { background: var(--text); color: white; border: none; padding: 0.6rem; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: auto; }
    .btn-recipe:hover { background: var(--accent); }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-content { background: white; max-width: 650px; width: 100%; max-height: 85vh; overflow-y: auto; border-radius: 12px; padding: 2rem; position: relative; }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="./index.html"><span class="brand-badge">SJG</span><span>Sandra's World Cuisine</span></a>
      <ul class="nav-links">
        <li><a href="./curries.html" style="color:var(--accent);">Curries</a></li>
        <li><a href="./satay.html">Satay</a></li>
        <li><a href="./chow-mein.html">Chow Mein</a></li>
        <li><a href="./italian.html">Italian</a></li>
        <li><a href="./thai.html">Thai</a></li>
        <li><a href="./about.html">About</a></li>
        <li><a href="./contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1>Signature World Curries</h1>
    <p style="color: var(--text-muted);">From slow-cooked braises to vibrant flash-fried masalas.</p>
    <div class="grid" id="curry-grid"></div>
  </main>

  <div class="modal" id="recipe-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const curries = [
      { id: "chana", title: "Punjabi Chana Masala", desc: "Chickpeas folded through dark tomato & onion masala with amchoor.", img: "https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=1000&q=85", ingredients: ["2 cans chickpeas", "2 onions, diced", "3 tomatoes, pureed", "1 tbsp amchoor (mango powder)", "2 tsp garam masala", "1 tbsp ginger-garlic paste"], steps: ["Sauté onions in ghee until deeply golden.", "Add ginger-garlic paste, pureed tomatoes, and spices; cook until oil separates.", "Add chickpeas and 1 cup water, simmer for 25 mins until thick."] },
      { id: "rogan", title: "Lamb Rogan Josh", desc: "Slow-braised lamb with Kashmiri chilli, fennel seeds, and cardamom.", img: "https://images.unsplash.com/photo-1603105037880-880cd4edfb0d?auto=format&fit=crop&w=1000&q=85", ingredients: ["800g lamb shoulder, cubed", "2 tbsp Kashmiri chilli powder", "1 tsp ground fennel seeds", "1 cup Greek yoghurt", "4 cardamom pods"], steps: ["Brown lamb in a heavy pot, then remove.", "Whisk yoghurt with spices and chili powder.", "Return lamb, pour yoghurt sauce over, cover and slow cook low for 2 hours."] },
      { id: "kerala", title: "Kerala Coconut Chicken", desc: "Chicken in coconut milk with mustard seeds, fresh curry leaves, and tamarind.", img: "https://images.unsplash.com/photo-1631292784640-2b24be784d5d?auto=format&fit=crop&w=1000&q=85", ingredients: ["600g chicken thighs", "400ml coconut milk", "1 tbsp mustard seeds", "12 fresh curry leaves", "1 tbsp tamarind paste"], steps: ["Fry mustard seeds and curry leaves until fragrant.", "Add chicken thighs and sear.", "Pour coconut milk and tamarind, simmer gently for 30 mins."] }
    ];

    document.getElementById('curry-grid').innerHTML = curries.map(c => `
      <div class="card">
        <img src="${c.img}" alt="${c.title}">
        <div class="card-body">
          <h3 class="card-title">${c.title}</h3>
          <p style="color:var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">${c.desc}</p>
          <button class="btn-recipe" onclick="openRecipe('${c.id}')">View Full Recipe</button>
        </div>
      </div>
    `).join('');

    function openRecipe(id) {
      const c = curries.find(item => item.id === id);
      document.getElementById('modal-body').innerHTML = `
        <h2>${c.title}</h2>
        <img src="${c.img}" style="width:100%; height:200px; object-fit:cover; border-radius:8px; margin:1rem 0;">
        <h3>Ingredients</h3><ul>${c.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
        <h3 style="margin-top:1rem;">Instructions</h3><ol>${c.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      `;
      document.getElementById('recipe-modal').classList.add('active');
    }
    function closeModal() { document.getElementById('recipe-modal').classList.remove('active'); }
  </script>
</body>
</html>
